name: Bug report
description: A check or tool behaves incorrectly, crashes, or hangs.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences. Skip the long story.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sudo plesk-toolbox audit sec/mail
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Paste the relevant emit lines or the error. Strip anything sensitive.
      render: text

  - type: input
    id: commit
    attributes:
      label: plesk-toolbox commit
      description: Output of `git -C /opt/plesk-toolbox rev-parse --short HEAD` or `git rev-parse HEAD` from your checkout.
    validations:
      required: true

  - type: input
    id: plesk
    attributes:
      label: Plesk version
      description: Output of `plesk version | head -1`.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: Output of `cat /etc/os-release | grep PRETTY_NAME`.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Optional. Workarounds you tried, hypotheses, related issues.
