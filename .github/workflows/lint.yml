name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash -n on every shell file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "FAIL: $f"; fail=1; }
          done < <(find bin lib audits.d tools.d mods.d -type f \
                     \( -name '*.sh' -o -path 'bin/*' \) -print0)
          exit $fail

      - name: shellcheck
        run: |
          # Project-wide exclusions match the local dev convention:
          #   SC1090/SC1091 — sourced libs, paths resolve at runtime
          #   SC2154        — vars set by sourced libs (PTBOX_ROOT etc.)
          #   SC2034/SC2155 — pre-existing patterns in lib/common.sh
          #   SC2002        — "useless cat" is a style nit; the cat | paste
          #                   pattern preserves a 2>/dev/null on missing files
          find bin lib audits.d tools.d mods.d -type f \
               \( -name '*.sh' -o -path 'bin/*' \) -print0 \
            | xargs -0 shellcheck -s bash -e SC1090,SC1091,SC2154,SC2002,SC2034,SC2155
